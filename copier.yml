_subdirectory: template
_exclude:
  - "{% if 'en' not in locales %}locales/en{% endif %}"
  - "{% if 'pt-BR' not in locales %}locales/pt-BR{% endif %}"
  - "{% if locales | length < 2 %}apps/web/src/LanguageSwitcher.tsx{% endif %}"
project_slug:
  type: str
  default: my-app
project_name:
  type: str
  default: "{{ project_slug }}"
author:
  type: str
  default: Your team
license:
  type: str
  default: MIT
  choices: [MIT, Apache-2.0, UNLICENSED]
locales:
  type: str
  help: BCP 47 locales to ship (English and/or Portuguese Brazil)
  choices:
    - en
    - pt-BR
  multiselect: true
  default:
    - en
    - pt-BR
  validator: >-
    {%- if locales | length < 1 -%}
    Select at least one locale
    {%- endif -%}
